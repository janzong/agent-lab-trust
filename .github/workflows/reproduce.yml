name: reproduce

on:
  push:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        tz: ["UTC", "Asia/Shanghai"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install 'pydantic>=2.7,<3' 'pytest>=8,<9'
      - name: Tests
        env:
          TZ: ${{ matrix.tz }}
        run: python -m pytest -q
      - name: Validate
        run: python -m agent_lab_trust.cli validate tests/fixtures/gen-mentor
      - name: Report
        run: python -m agent_lab_trust.cli report tests/fixtures/gen-mentor
      - name: Deletion proof
        run: python -m agent_lab_trust.cli deletion-proof
