[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lab-trust"
version = "0.2.0rc1"
description = "Local-first agent run validator with policy evaluation, hashed reports, and deletion proof"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.scripts]
agent-lab-trust = "agent_lab_trust.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
agent_lab_trust = ["policy-candidates-v0.json"]
